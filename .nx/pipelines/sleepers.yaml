triggers:
  pull-requests:
    event: PR
    branches: ['main']

workflows:
  sleep-01:
    runs-on: linux-small-js
    timeout-minutes: 20
    steps:
      - name: Sleep
        script: |
          for i in $(seq 1 20); do echo "tick $i"; sleep 30; done
